<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Login Page
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <style>
   @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
 </head>
 <body class="bg-[#faf9f9] min-h-screen flex items-center justify-center p-4">
  <div class="max-w-5xl w-full bg-white rounded-md shadow-lg flex flex-col md:flex-row overflow-hidden">
   <!-- Left side with gradient shape -->
   <div class="md:w-1/2 relative bg-gradient-to-tr from-[#6c5dd3] to-[#f5c68a] flex items-center justify-center p-10">
    <img alt="Abstract gradient shape with purple and peach colors" class="absolute inset-0 w-full h-full object-cover" height="600" src="https://storage.googleapis.com/a1aa/image/efa5d72d-9664-46cf-07a9-055a033abc6c.jpg" width="600"/>
    <div class="relative z-10 text-white font-extrabold text-4xl md:text-5xl leading-tight max-w-xs">
     Bienvenido!
    </div>
   </div>
   <!-- Right side with form -->
   <div class="md:w-1/2 p-10 flex flex-col justify-center">
    <h2 class="text-2xl font-extrabold text-gray-800 mb-2">
     Inicio de Sesion
    </h2>
    <p class="text-xs text-gray-400 mb-8">
     Bienvenido! Por favor inicia sesión con su cuenta.
    </p>
    <form class="space-y-6">
     <div>
      <label class="block text-xs text-gray-400 mb-1" for="username">
       Nombre de usuario
      </label>
      <input class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#6c5dd3]" id="username" name="username" placeholder="username@gmail.com" type="email"/>
     </div>
     <div>
      <label class="block text-xs text-gray-400 mb-1" for="password">
       Contraseña
      </label>
      <input class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#6c5dd3]" id="password" name="password" placeholder="*********" type="password"/>
     </div>
     <div class="flex items-center justify-between text-xs text-gray-400 mb-6">
      <label class="flex items-center space-x-2">
       <input checked="" class="w-4 h-4 rounded-full border border-gray-300 text-[#6c5dd3] focus:ring-0 focus:ring-offset-0" type="checkbox"/>
       <span class="text-[10px] text-gray-600 font-semibold select-none">
        Recuerdame
       </span>
      </label>
      <button class="text-[10px] text-gray-300 font-semibold cursor-default select-none" disabled="" type="button">
       Olvido contraseña?
      </button>
     </div>
     <button class="w-full bg-[#6c5dd3] text-white text-sm font-semibold py-3 rounded-md hover:bg-[#5a4bcf] transition-colors" type="submit">
      Inciar Sesión
     </button>
    </form>
    <p class="mt-6 text-xs text-gray-400">
     Nuevo usuario?
     <a class="text-[#6c5dd3] font-semibold" href="#">
      Registrarse
     </a>
    </p>
   </div>
  </div>
 </body>
</html>
